services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: malabomarket
      POSTGRES_USER: malabomarket
      POSTGRES_PASSWORD: malabomarket
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: dev-secret-key-cambiar-en-produccion
      DATABASE_URL: postgres://malabomarket:malabomarket@db:5432/malabomarket
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:

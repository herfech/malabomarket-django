{% load listing_extras %}
{% if page.paginator.num_pages > 1 %}
<nav class="mt-6 flex items-center justify-between text-sm print:hidden" aria-label="Paginación">
  {% if page.has_previous %}<a href="{% querystring page=page.previous_page_number %}" class="font-medium text-navy hover:underline">Anterior</a>{% else %}<span></span>{% endif %}
  <span class="text-charcoal/55 tnum">Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="{% querystring page=page.next_page_number %}" class="font-medium text-navy hover:underline">Siguiente</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}

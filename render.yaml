databases:
  - name: malabomarket-db
    plan: starter
    databaseName: malabomarket
    user: malabomarket

services:
  - type: web
    name: malabomarket-web
    runtime: docker
    plan: starter
    healthCheckPath: /salud/
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: malabomarket-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: SITE_NAME_FIRST
        sync: false
      - key: SITE_NAME_SECOND
        sync: false
      - key: SITE_PHONE
        sync: false
      - key: SITE_WHATSAPP
        sync: false
      - key: SITE_EMAIL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  # Marca como "expirados" los anuncios vencidos (1 vez al día, 03:00 UTC)
  - type: cron
    name: malabomarket-expirar-anuncios
    runtime: docker
    plan: starter
    schedule: "0 3 * * *"
    dockerCommand: python manage.py expire_listings
    envVars:
      - fromService: {type: web, name: malabomarket-web, envVarKey: DJANGO_SETTINGS_MODULE}
      - fromService: {type: web, name: malabomarket-web, envVarKey: DJANGO_SECRET_KEY}
      - key: DATABASE_URL
        fromDatabase:
          name: malabomarket-db
          property: connectionString
      - fromService: {type: web, name: malabomarket-web, envVarKey: DJANGO_ALLOWED_HOSTS}
      - fromService: {type: web, name: malabomarket-web, envVarKey: DJANGO_CSRF_TRUSTED_ORIGINS}
      - fromService: {type: web, name: malabomarket-web, envVarKey: AWS_ACCESS_KEY_ID}
      - fromService: {type: web, name: malabomarket-web, envVarKey: AWS_SECRET_ACCESS_KEY}
      - fromService: {type: web, name: malabomarket-web, envVarKey: AWS_STORAGE_BUCKET_NAME}
      - fromService: {type: web, name: malabomarket-web, envVarKey: AWS_S3_ENDPOINT_URL}
